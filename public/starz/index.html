<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1128" />
  <title>STARZ · 아이스하키팀 플랫폼</title>
  <!-- 배포 주소가 /starz 든 /starz/ 든 상대경로가 항상 /starz/ 아래로 풀리도록 base 고정.
       (링크들보다 먼저 와야 함) 로컬 file:// 로 직접 열 때만 상대경로로 되돌린다. -->
  <base href="/starz/" id="appbase" />
  <script>if (location.protocol === 'file:') document.getElementById('appbase').setAttribute('href', './');</script>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <!-- PWA (설치형 앱) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="STARZ" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/logo.jpg" alt="STARZ" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-name">STARZ</span>
        <span class="brand-sub">ICE HOCKEY</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">📊</span>대시보드</button>
      <button class="nav-item" data-view="rsvp"><span class="nav-ico">✋</span>이번주 참석</button>
      <button class="nav-item" data-view="attendance"><span class="nav-ico">✅</span>출석체크(기록)</button>
      <button class="nav-item" data-view="monthly"><span class="nav-ico">📅</span>월간 출석현황</button>
      <button class="nav-item" data-view="members"><span class="nav-ico">🏒</span>멤버 명단</button>
      <button class="nav-item" data-view="schedule"><span class="nav-ico">🗓️</span>일정</button>
      <button class="nav-item" data-view="notices"><span class="nav-ico">📢</span>공지사항</button>
      <button class="nav-item" data-view="resources"><span class="nav-ico">🎬</span>자료실</button>
      <button class="nav-item" data-view="guide"><span class="nav-ico">📖</span>사용법</button>
    </nav>
    <div class="sidebar-foot">
      <div class="mode-badge" id="modeBadge" title="연결 상태">연결 확인 중…</div>
      <button class="btn gold sm" id="btnInstall" hidden>📲 앱 설치하기</button>
      <button class="btn-ghost sm" id="btnBackup">⬇︎ 백업 저장</button>
      <button class="btn-ghost sm" id="btnRestore">⬆︎ 백업 불러오기</button>
      <input type="file" id="restoreFile" accept="application/json" hidden />
      <p class="foot-note" id="footNote">정기적으로 백업하세요.</p>
    </div>
  </aside>

  <!-- 모바일 메뉴 배경 (탭하면 메뉴 닫힘) -->
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="메뉴">☰</button>
      <h1 class="page-title" id="pageTitle">대시보드</h1>
      <div class="topbar-right">
        <span class="today" id="todayLabel"></span>
      </div>
    </header>

    <main class="content" id="content"><!-- views injected here --></main>
  </div>

  <!-- ===== Modal ===== -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">제목</h3>
        <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 공유 모드용 Supabase (config.js 미설정 시 개인 모드로 자동 동작) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
