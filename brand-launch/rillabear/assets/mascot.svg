    <path d="M-16 -2 L-4 -10 L0 -2 L4 -10 L16 -2 C8 4 -8 4 -16 -2 Z" fill="#4FA65B" stroke="#2F7A3E" stroke-width="2.5"/>
    <circle cx="-8" cy="10" r="1.6" fill="#FFE3A0"/><circle cx="6" cy="8" r="1.6" fill="#FFE3A0"/>
    <circle cx="0" cy="18" r="1.6" fill="#FFE3A0"/><circle cx="-6" cy="24" r="1.6" fill="#FFE3A0"/>
