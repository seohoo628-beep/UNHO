      <stop offset="0%" stop-color="#FFF4E4"/>
      <stop offset="100%" stop-color="#F5DFC2"/>
    </radialGradient>
    <linearGradient id="rbBerry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B80"/>
      <stop offset="100%" stop-color="#E23A55"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <circle cx="66" cy="78" r="30" fill="url(#rbFace)" stroke="#3A2E2B" stroke-width="5"/>
  <circle cx="174" cy="78" r="30" fill="url(#rbFace)" stroke="#3A2E2B" stroke-width="5"/>
  <circle cx="66" cy="78" r="14" fill="#FFD0D8"/>
  <circle cx="174" cy="78" r="14" fill="#FFD0D8"/>
  <!-- head -->
  <circle cx="120" cy="132" r="74" fill="url(#rbFace)" stroke="#3A2E2B" stroke-width="5"/>
  <!-- cheeks -->
  <circle cx="80" cy="150" r="15" fill="#FFB3C0" opacity=".85"/>
  <circle cx="160" cy="150" r="15" fill="#FFB3C0" opacity=".85"/>
  <!-- eyes -->
