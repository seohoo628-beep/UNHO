<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="릴라베어 마스코트 릴라 — 딸기를 안은 크림빛 곰">
  <defs>
    <linearGradient id="rbFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBEAD2"/><stop offset="100%" stop-color="#F1D7B4"/>
    </linearGradient>
    <linearGradient id="rbBerry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6E82"/><stop offset="100%" stop-color="#DF3850"/>
    </linearGradient>
    <radialGradient id="rbCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB0BF"/><stop offset="100%" stop-color="#FFC7D2"/>
    </radialGradient>
  </defs>
  <g stroke="#5A4130" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <ellipse cx="116" cy="306" rx="30" ry="25" fill="url(#rbFur)"/>
    <ellipse cx="184" cy="306" rx="30" ry="25" fill="url(#rbFur)"/>
    <ellipse cx="116" cy="313" rx="14" ry="9" fill="#FFFDF8" stroke="none"/>
    <ellipse cx="184" cy="313" rx="14" ry="9" fill="#FFFDF8" stroke="none"/>
    <!-- body -->
    <path d="M150 148 C212 148 226 200 221 242 C216 292 187 314 150 314 C113 314 84 292 79 242 C74 200 88 148 150 148 Z" fill="url(#rbFur)"/>
    <path d="M150 176 C184 176 197 210 194 246 C191 286 173 302 150 302 C127 302 109 286 106 246 C103 210 116 176 150 176 Z" fill="#FFFDF8" stroke="none"/>
    <!-- right arm (behind berry, wrapping) -->
    <path d="M214 198 C240 214 240 254 214 268 C200 274 184 268 176 258 C190 244 196 224 194 206 Z" fill="url(#rbFur)"/>
    <!-- berry, hugged low-center -->
    <path d="M150 306 C114 306 96 270 103 240 C108 214 130 202 150 202 C170 202 192 214 197 240 C204 270 186 306 150 306 Z" fill="url(#rbBerry)"/>
    <path d="M150 202 C143 189 128 186 118 191 C128 196 133 203 135 211 C140 205 145 202 150 202 C155 202 160 205 165 211 C167 203 172 196 182 191 C172 186 157 189 150 202 Z" fill="#5FB55F" stroke="#2F7A3E" stroke-width="2.5"/>
    <g stroke="none" fill="#FFE7AE">
      <circle cx="132" cy="236" r="2.5"/><circle cx="150" cy="230" r="2.5"/><circle cx="168" cy="236" r="2.5"/>
      <circle cx="124" cy="256" r="2.5"/><circle cx="142" cy="252" r="2.5"/><circle cx="158" cy="252" r="2.5"/><circle cx="176" cy="256" r="2.5"/>
      <circle cx="134" cy="276" r="2.5"/><circle cx="150" cy="280" r="2.5"/><circle cx="166" cy="276" r="2.5"/>
    </g>
    <!-- left arm (in front, wrapping over berry) -->
    <path d="M86 198 C60 214 60 256 88 270 C104 277 124 271 138 260 C120 252 108 236 104 218 C100 206 92 200 86 198 Z" fill="url(#rbFur)"/>
    <ellipse cx="120" cy="262" rx="16" ry="14" fill="url(#rbFur)"/>
    <!-- ears -->
    <circle cx="102" cy="52" r="27" fill="url(#rbFur)"/>
    <circle cx="198" cy="52" r="27" fill="url(#rbFur)"/>
    <circle cx="102" cy="52" r="12.5" fill="#FFC9D2" stroke="none"/>
    <circle cx="198" cy="52" r="12.5" fill="#FFC9D2" stroke="none"/>
    <!-- head -->
    <circle cx="150" cy="96" r="64" fill="url(#rbFur)"/>
    <!-- brows -->
    <path d="M116 74 q10 -7 20 -1" fill="none" stroke-width="4.5"/>
    <path d="M164 73 q10 -6 20 1" fill="none" stroke-width="4.5"/>
    <!-- cheeks -->
    <circle cx="104" cy="114" r="14" fill="url(#rbCheek)" stroke="none"/>
    <circle cx="196" cy="114" r="14" fill="url(#rbCheek)" stroke="none"/>
    <!-- muzzle -->
    <ellipse cx="150" cy="120" rx="35" ry="27" fill="#FFFDF8"/>
    <!-- eyes -->
    <ellipse cx="123" cy="94" rx="8.5" ry="10.5" fill="#4A362B" stroke="none"/>
    <ellipse cx="177" cy="94" rx="8.5" ry="10.5" fill="#4A362B" stroke="none"/>
    <circle cx="126" cy="90" r="3" fill="#fff" stroke="none"/>
    <circle cx="180" cy="90" r="3" fill="#fff" stroke="none"/>
    <!-- nose + happy mouth -->
    <ellipse cx="150" cy="110" rx="8" ry="6" fill="#5A4130" stroke="none"/>
    <path d="M150 116 v6" fill="none" stroke-width="4.5"/>
    <path d="M150 122 C141 134 129 132 125 123 C133 130 143 129 150 122 C157 129 167 130 175 123 C171 132 159 134 150 122 Z" fill="#E96A7B"/>
  </g>
</svg>
