  <circle cx="143" cy="126" r="9" fill="#3A2E2B"/>
  <circle cx="100" cy="123" r="3" fill="#fff"/>
  <circle cx="146" cy="123" r="3" fill="#fff"/>
  <!-- muzzle -->
