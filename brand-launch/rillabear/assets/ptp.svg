<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="릴라베어 PTP 블리스터 디자인 58x98mm 10정">
  <defs>
    <linearGradient id="tCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFC66E"/><stop offset="55%" stop-color="#F49A50"/><stop offset="100%" stop-color="#E67E42"/></linearGradient>
    <linearGradient id="tBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5556C"/><stop offset="100%" stop-color="#FF8093"/></linearGradient>
    <linearGradient id="tBerry" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF6E82"/><stop offset="100%" stop-color="#DF3850"/></linearGradient>
    <style>text{font-family:Pretendard,sans-serif}</style>
  </defs>

  <!-- ============ FRONT: 성형면(캡슐) ============ -->
  <g>
    <rect x="8" y="10" width="58" height="98" rx="8" fill="#FFF7F1" stroke="#E7D9C6" stroke-width="0.8"/>
    <!-- brand strip -->
    <rect x="8" y="10" width="58" height="12" rx="8" fill="url(#tBand)"/>
    <rect x="8" y="16" width="58" height="6" fill="url(#tBand)"/>
    <text x="37" y="19" text-anchor="middle" font-size="6" font-weight="800" fill="#fff">릴라베어</text>
    <!-- 10 oval capsule cavities: 2 cols x 5 rows -->
    <g stroke="#C9702F" stroke-width="0.5">
      <!-- row centers y: 32,47,62,77,92 ; col centers x: 25,49 -->
      <g>
        <ellipse cx="25" cy="32" rx="10.5" ry="6" fill="url(#tCap)"/><ellipse cx="49" cy="32" rx="10.5" ry="6" fill="url(#tCap)"/>
        <ellipse cx="25" cy="47" rx="10.5" ry="6" fill="url(#tCap)"/><ellipse cx="49" cy="47" rx="10.5" ry="6" fill="url(#tCap)"/>
        <ellipse cx="25" cy="62" rx="10.5" ry="6" fill="url(#tCap)"/><ellipse cx="49" cy="62" rx="10.5" ry="6" fill="url(#tCap)"/>
        <ellipse cx="25" cy="77" rx="10.5" ry="6" fill="url(#tCap)"/><ellipse cx="49" cy="77" rx="10.5" ry="6" fill="url(#tCap)"/>
        <ellipse cx="25" cy="92" rx="10.5" ry="6" fill="url(#tCap)"/><ellipse cx="49" cy="92" rx="10.5" ry="6" fill="url(#tCap)"/>
      </g>
      <!-- highlights -->
      <g fill="#FFE6C0" stroke="none" opacity="0.9">
        <ellipse cx="21" cy="30" rx="3.2" ry="1.4"/><ellipse cx="45" cy="30" rx="3.2" ry="1.4"/>
        <ellipse cx="21" cy="45" rx="3.2" ry="1.4"/><ellipse cx="45" cy="45" rx="3.2" ry="1.4"/>
        <ellipse cx="21" cy="60" rx="3.2" ry="1.4"/><ellipse cx="45" cy="60" rx="3.2" ry="1.4"/>
        <ellipse cx="21" cy="75" rx="3.2" ry="1.4"/><ellipse cx="45" cy="75" rx="3.2" ry="1.4"/>
        <ellipse cx="21" cy="90" rx="3.2" ry="1.4"/><ellipse cx="45" cy="90" rx="3.2" ry="1.4"/>
      </g>
    </g>
    <text x="37" y="104" text-anchor="middle" font-size="3.4" font-weight="700" fill="#8A7A72">500mg 오벌 연질캡슐 · 10정 · 딸기맛</text>
    <text x="37" y="122" text-anchor="middle" font-size="3.6" font-weight="800" fill="#3A2E2B">앞(성형면) · 58 × 98mm · 2×5 = 10캡슐</text>
  </g>

  <!-- ============ BACK: 인쇄면(리드 포일) ============ -->
  <g>
    <rect x="120" y="10" width="58" height="98" rx="8" fill="#FFFFFF" stroke="#E7D9C6" stroke-width="0.8"/>
    <rect x="120" y="10" width="58" height="16" rx="8" fill="url(#tBand)"/>
    <rect x="120" y="20" width="58" height="6" fill="url(#tBand)"/>
    <!-- mini mascot -->
    <g transform="translate(132,18)">
      <circle cx="0" cy="0" r="5.2" fill="#FBEAD2" stroke="#5A4130" stroke-width="0.8"/>
      <circle cx="-4" cy="-4.4" r="2.1" fill="#FBEAD2" stroke="#5A4130" stroke-width="0.8"/><circle cx="4" cy="-4.4" r="2.1" fill="#FBEAD2" stroke="#5A4130" stroke-width="0.8"/>
      <circle cx="-2" cy="-0.6" r="0.8" fill="#4A362B"/><circle cx="2" cy="-0.6" r="0.8" fill="#4A362B"/>
      <path d="M0 4 C-3 4 -4.4 1 -3.4 -1 C-2.6 -2.2 2.6 -2.2 3.4 -1 C4.4 1 3 4 0 4 Z" fill="url(#tBerry)" stroke="#5A4130" stroke-width="0.7"/>
    </g>
    <text x="150" y="20" text-anchor="middle" font-size="6" font-weight="800" fill="#fff">릴라베어</text>
    <!-- printed back copy -->
    <text x="126" y="34" font-size="3.7" font-weight="800" fill="#3A2E2B">릴라베어 씹어먹는 들깨오메가3</text>
    <text x="126" y="40" font-size="3.1" fill="#6a5a52">건강기능식품 · 딸기맛 · 연질캡슐</text>
    <line x1="126" y1="43" x2="172" y2="43" stroke="#EFE6DA" stroke-width="0.6"/>
    <text x="126" y="49.5" font-size="3.1" fill="#3A2E2B">· 내용량: 500mg × 10캡슐(1블리스터)</text>
    <text x="126" y="55" font-size="3.1" fill="#3A2E2B">· 주원료: UVS 비가열 특허 들깨오일 100%</text>
    <text x="126" y="60.5" font-size="3.1" fill="#3A2E2B">· 섭취: 1일 2캡슐, 씹거나 삼켜서</text>
    <text x="126" y="66" font-size="3.1" fill="#3A2E2B">· 온 가족(어린이·성인) 공용</text>
    <line x1="126" y1="69" x2="172" y2="69" stroke="#EFE6DA" stroke-width="0.6"/>
    <!-- cert chips -->
    <g font-size="2.7" font-weight="800" text-anchor="middle">
      <rect x="126" y="72" width="15" height="6.5" rx="3.25" fill="#E4F3E4"/><text x="133.5" y="76.4" fill="#2F7A3E">FDA</text>
      <rect x="143" y="72" width="15" height="6.5" rx="3.25" fill="#FFE3E8"/><text x="150.5" y="76.4" fill="#DF3850">비건</text>
      <rect x="160" y="72" width="13" height="6.5" rx="3.25" fill="#FFF0D0"/><text x="166.5" y="76.4" fill="#9A6B12">할랄</text>
    </g>
    <text x="126" y="86" font-size="2.7" fill="#8A7A72">제조원: 일품에스피(주) · 판매원: 운호컴퍼니</text>
    <text x="126" y="91" font-size="2.7" fill="#8A7A72">유통기한·제조번호: 하단 별도 표기</text>
    <rect x="126" y="94" width="46" height="8" rx="1.5" fill="none" stroke="#C9BEB0" stroke-width="0.5" stroke-dasharray="1.5 1.2"/>
    <text x="149" y="99.4" text-anchor="middle" font-size="2.7" fill="#B0A498">LOT / EXP 각인 영역</text>
    <text x="149" y="122" text-anchor="middle" font-size="3.6" font-weight="800" fill="#3A2E2B">뒤(인쇄면·리드포일)</text>
  </g>

  <text x="100" y="138" text-anchor="middle" font-size="3.4" fill="#8A7A72">※ 첨부 칼선(58×98mm, 10 오벌 캐비티) 기준 임의 디자인 시안 · 최종 규격은 제조사 확정</text>
</svg>
