<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  카드뉴스 기본 템플릿 (1080×1350).
  {{FONTS_DIR}} 토큰은 render_cards.py가 렌더 시점에 repo 번들 Pretendard
  폰트 경로로 치환한다. 컬러 변수만 계정 설정값으로 바꿔 쓴다.
-->
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; src: local("Pretendard"), url("{{FONTS_DIR}}/Pretendard-Regular.otf"); }
  @font-face { font-family: "Pretendard"; font-weight: 500; src: local("Pretendard Medium"), url("{{FONTS_DIR}}/Pretendard-Medium.otf"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; src: local("Pretendard SemiBold"), url("{{FONTS_DIR}}/Pretendard-SemiBold.otf"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: local("Pretendard Bold"), url("{{FONTS_DIR}}/Pretendard-Bold.otf"); }
  @font-face { font-family: "Pretendard"; font-weight: 800; src: local("Pretendard ExtraBold"), url("{{FONTS_DIR}}/Pretendard-ExtraBold.otf"); }

  :root {
    --bg: #F7F4EF;      /* 계정 colors.bg */
    --ink: #2B2622;     /* 계정 colors.ink */
    --accent: #A8865C;  /* 계정 colors.accent */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: Pretendard, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    padding: 96px 88px;
    word-break: keep-all;
    line-height: 1.35;
  }
  .kicker { font-size: 34px; font-weight: 600; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  .title  { margin-top: 40px; font-size: 96px; font-weight: 800; line-height: 1.22; }
  .body   { margin-top: 48px; font-size: 44px; font-weight: 500; line-height: 1.55; }
  .spacer { flex: 1; }
  .footer { display: flex; justify-content: space-between; align-items: center; font-size: 30px; font-weight: 600; color: var(--accent); }
  .rule   { width: 88px; height: 8px; background: var(--accent); margin-top: 44px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="kicker">BRAND · SERIES</div>
  <div class="title">훅 한 문장을<br>여기에 크게</div>
  <div class="rule"></div>
  <div class="body">본문 카드에서는 이 블록에 메시지 하나를 3줄 이내로 담는다.</div>
  <div class="spacer"></div>
  <div class="footer"><span>@handle</span><span>01 / 05</span></div>
</body>
</html>
